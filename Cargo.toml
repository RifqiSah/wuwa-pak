[package]
name = "wuwa-pak"
version = "0.1.0"
edition = "2024"

[features]
default = ["file"]
file = []
online = []

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }
byteorder = "1.5.0"
hex = "0.4"
aes = "^0.8.3"
cipher = "0.4"
reqwest = { version = "0.11", features = ["blocking", "json", "gzip"] }

flate2 = { version = "1.0" }
zstd = { version = "0.13" }
lz4_flex = { version = "0.11.3" }
# oodle_loader = { path = "../../repak/oodle_loader" }
oodle_loader = { git = "https://github.com/xavo95/repak.git", package = "oodle_loader" }
